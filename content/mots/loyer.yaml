notes_de_relecture:
  - Source non ouverte, faute d'accès au web pendant la rédaction. Définition écrite de mémoire, à vérifier sur service-public.fr.
  - Le mot « montant » est-il compris ? Alternative, « Le bail dit combien vous payez ».
  - « Bail » est difficile. Il a sa fiche et il est lié.
  - On paie aussi un loyer pour un garage ou une voiture. Sens écarté.
