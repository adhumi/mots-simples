definition:
  - Une mutuelle est une assurance pour vos dépenses de santé.
  - Elle rembourse une partie de ce que la Sécurité sociale ne paie pas.
  - Pour cela, vous lui payez une somme d'argent, souvent chaque mois.

exemple: Vous envoyez la facture de vos lunettes à votre mutuelle.

