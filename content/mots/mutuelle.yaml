notes_de_relecture:
  - Source non ouverte, faute d'accès au web pendant la rédaction. Définition écrite de mémoire, à vérifier sur ameli.fr.
  - « Sécurité sociale » n'a pas de fiche. Le mot est connu, mais il faut sans doute une fiche. Voir le rapport.
  - Le vrai nom est « complémentaire santé ». La mutuelle en est une sorte. La fiche suit l'usage courant.
  - « Assurance » est un mot difficile. Il a sa fiche dans la liste et il est lié.
