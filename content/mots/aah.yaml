definition:
  - L'AAH est une aide en argent pour les adultes en situation de handicap.
  - Vous la recevez chaque mois si vous y avez droit.
  - Elle vous aide à payer ce dont vous avez besoin pour vivre.

exemple: Vous demandez l'AAH en envoyant un dossier à la MDPH.

