definition:
  - La MDPH est un lieu qui informe et aide les personnes en situation de handicap.
  - Il y en a une dans chaque département.
  - Vous lui envoyez vos demandes d'aides liées au handicap.

exemple: Vous déposez votre dossier à la MDPH de votre département.

