definition:
  - Un ESAT est un lieu de travail pour des adultes en situation de handicap.
  - Vous y travaillez avec des professionnels qui vous accompagnent.
  - Vous recevez de l'argent chaque mois pour votre travail.

exemple: Lina travaille à l'ESAT, dans l'équipe des espaces verts.

