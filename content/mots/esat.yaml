notes_de_relecture:
  - Source non ouverte, faute d'accès au web pendant la rédaction. Définition écrite de mémoire, à vérifier sur monparcourshandicap.gouv.fr.
  - Mot sensible. La fiche présente l'ESAT comme un lieu de travail, sans parler de capacité.
  - Le nom développé a changé. Les deux formes sont dans les formes de recherche. À vérifier contre la source.
  - « Professionnels » est-il compris ? Alternative, « des personnes dont c'est le métier ».
  - La fiche ne dit pas comment on entre en ESAT. C'est une règle, pas le sens du mot.
  - Prononciation « ésate » à écouter avec la voix du téléphone.
