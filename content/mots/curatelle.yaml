notes_de_relecture:
  - Source non ouverte, faute d'accès au web pendant la rédaction. Définition écrite de mémoire, à vérifier sur service-public.fr.
  - Mot sensible. La fiche insiste sur ce que la personne continue à décider.
  - Il existe plusieurs sortes de curatelle, plus ou moins fortes. La fiche décrit la plus simple. À vérifier.
  - « Curateur » est de la famille du mot, mais il faut bien le nommer.
  - « Protection » est abstrait. Alternative à tester, « une aide décidée par un juge ».
