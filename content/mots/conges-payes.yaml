mot: Congés payés
slug: conges-payes
prononciation: null
theme: travail
statut: brouillon
valide_le: null

definition:
  - Les congés payés sont des jours de repos où vous recevez votre salaire.
  - Vous y avez droit quand vous travaillez pour un employeur.
  - Votre employeur doit donner son accord sur les dates.

exemple: Vous prenez vos congés payés en août pour partir en vacances.

