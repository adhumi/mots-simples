schema: 1
mot: Rendez-vous
slug: rendez-vous
prononciation: null
theme: vie-quotidienne
statut: brouillon
valide_le: null

definition:
  - Un rendez-vous est une rencontre prévue à un jour et à une heure précis.
  - Vous le prenez à l'avance, par téléphone, sur internet ou sur place.

exemple: Vous avez rendez-vous chez le dentiste mardi matin.

autres_sens: []

a_ne_pas_confondre:
  mot: convocation
  difference: Une convocation est obligatoire. Vous ne choisissez pas la date.

