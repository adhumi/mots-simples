definition:
  - Une ordonnance est un document écrit par votre médecin.
  - Elle dit quels médicaments ou quels soins il vous faut.
  - Vous la donnez au pharmacien pour avoir vos médicaments.

exemple: Le médecin vous remet une ordonnance à la fin du rendez-vous.

autres_sens:
  - definition:
      - C'est aussi une décision écrite par un juge.

