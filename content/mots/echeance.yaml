notes_de_relecture:
  - Source non ouverte, faute d'accès au web pendant la rédaction. Définition écrite de mémoire, à vérifier sur mesquestionsdargent.fr.
  - Le deuxième sens, la somme à payer, est proche de « mensualité ». À garder ou à retirer.
  - Une échéance peut aussi être la fin d'un contrat. Sens écarté pour rester simple.
