schema: 1
mot: Échéance
slug: echeance
prononciation: null
theme: argent
statut: brouillon
valide_le: null

definition:
  - Une échéance est la date limite pour payer quelque chose.
  - Après cette date, vous êtes en retard.

exemple: L'échéance de votre facture est écrite en haut du courrier.

autres_sens:
  - definition:
      - C'est aussi une somme d'argent à payer à une date prévue.
    exemple: Vous payez votre canapé en plusieurs échéances.

a_ne_pas_confondre: null

mots_lies:
