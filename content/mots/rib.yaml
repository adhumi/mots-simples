mot: RIB
slug: rib
prononciation: rib
theme: argent
statut: brouillon
valide_le: null

definition:
  - Un RIB est un document donné par votre banque.
  - Il porte votre nom et le numéro de votre compte.
  - Vous le donnez pour recevoir de l'argent ou pour payer par prélèvement.

exemple: Votre employeur vous demande un RIB pour verser votre salaire.

