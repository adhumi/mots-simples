notes_de_relecture:
  - Source non ouverte, faute d'accès au web pendant la rédaction. Définition écrite de mémoire, à vérifier sur mesquestionsdargent.fr.
  - « Le numéro de votre compte » remplace IBAN, jugé trop difficile. IBAN est dans les formes de recherche.
  - La troisième phrase porte deux usages. À couper si elle est mal comprise en séance.
  - Le mot « prélèvement » est difficile. Il a sa fiche et il est lié.
