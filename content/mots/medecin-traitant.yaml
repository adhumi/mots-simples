schema: 1
mot: Médecin traitant
slug: medecin-traitant
prononciation: null
theme: sante
statut: brouillon
valide_le: null

definition:
  - Le médecin traitant est le médecin que vous choisissez pour vous suivre.
  - Vous allez le voir en premier quand vous êtes malade.
  - Il connaît votre santé et vous envoie vers d'autres médecins si besoin.

exemple: Vous prenez rendez-vous avec votre médecin traitant pour renouveler votre ordonnance.

