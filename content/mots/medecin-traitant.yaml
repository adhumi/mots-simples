notes_de_relecture:
  - Source non ouverte, faute d'accès au web pendant la rédaction. Définition écrite de mémoire, à vérifier sur ameli.fr.
  - Le mot « médecin » revient dans la définition. La consigne interdit les synonymes, donc pas de « docteur ».
  - « Vous suivre » est-il compris ? Alternative, « pour s'occuper de votre santé ».
  - La fiche ne parle pas du remboursement lié au choix de ce médecin. C'est une règle, pas le sens du mot.
