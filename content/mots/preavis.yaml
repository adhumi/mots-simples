mot: Préavis
slug: preavis
prononciation: null
theme: logement
statut: brouillon
valide_le: null

definition:
  - Un préavis est un temps à respecter avant de quitter votre logement.
  - Il commence quand vous prévenez le propriétaire de votre départ.
  - Pendant ce temps, vous payez encore le loyer.

exemple: Vous envoyez une lettre au propriétaire pour commencer votre préavis.

autres_sens:
  - definition:
      - Au travail, c'est le temps entre l'annonce du départ et le dernier jour.
    exemple: Après sa démission, Karim travaille encore pendant son préavis.
  - definition:
      - C'est aussi l'annonce d'une grève, faite quelques jours avant.
    exemple: Un préavis de grève annonce moins de trains demain.

a_ne_pas_confondre: null

