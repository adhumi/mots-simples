notes_de_relecture:
  - Source non ouverte, faute d'accès au web pendant la rédaction. Définition écrite de mémoire, à vérifier sur service-public.fr.
  - La durée du préavis n'est pas donnée, c'est voulu. Elle dépend du bail et de la situation.
  - Le propriétaire aussi peut donner un préavis. La fiche prend le point de vue du locataire.
  - Trois sens, c'est beaucoup. Le sens « grève » peut partir si la fiche est trop longue.
