notes_de_relecture:
  - Source non ouverte, faute d'accès au web pendant la rédaction. Définition écrite de mémoire, à vérifier sur mesquestionsdargent.fr.
  - « Sans rien faire vous-même » simplifie. Vous signez d'abord un accord, appelé mandat.
  - Le mot « compte » veut dire compte en banque. Est-il compris seul ?
  - Le sens médical est-il utile ici ? Les gens disent plutôt « prise de sang ».
