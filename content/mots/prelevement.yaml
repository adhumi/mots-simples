schema: 1
mot: Prélèvement
slug: prelevement
prononciation: null
theme: argent
statut: brouillon
valide_le: null

definition:
  - Un prélèvement est une façon de payer sans rien faire vous-même.
  - Vous donnez votre accord une seule fois.
  - Ensuite, l'argent part tout seul de votre compte à chaque paiement.

exemple: Votre loyer est payé par prélèvement au début de chaque mois.

autres_sens:
  - definition:
      - C'est aussi un peu de sang pris par une infirmière pour un examen.
    exemple: L'infirmière fait un prélèvement de sang à votre bras.

a_ne_pas_confondre:
  mot: virement
  difference: Le virement, c'est vous qui l'envoyez. Le prélèvement est pris par celui que vous payez.

mots_lies:
