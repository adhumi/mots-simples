definition:
  - Une fiche de paie est un document que votre employeur vous donne chaque mois.
  - Elle dit combien vous gagnez et combien vous recevez vraiment sur votre compte.
  - Elle sert souvent de preuve, par exemple pour louer un logement.

exemple: Pour louer un appartement, vous montrez vos dernières fiches de paie.

