definition:
  - Un justificatif de domicile est un document qui prouve où vous habitez.
  - Il porte votre nom et votre adresse.
  - C'est souvent une facture récente d'électricité, d'eau ou de téléphone.

exemple: Pour refaire votre carte d'identité, la mairie demande un justificatif de domicile.

