definition:
  - La carte Vitale est la carte verte que vous montrez pour vos soins.
  - Elle montre que la Sécurité sociale paie une partie de vos soins.
  - Grâce à elle, le remboursement arrive plus vite et sans papier à envoyer.

exemple: À la pharmacie, vous donnez votre carte Vitale avec votre ordonnance.

